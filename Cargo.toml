[workspace]
resolver = "2"
members = [
    "components/chroot",
    "components/gate",
    "components/latch-n2",
    "components/latch-n3",
    "components/latch-n4",
    "components/latch-n5",
    "components/latch-defer-all",
    "components/latch-deny-all",
    "components/latch-readonly",
    "components/readonly",
    "components/trace",
    "crates/filesystem-latch-n",
    "crates/test-harness",
]

[workspace.dependencies]
chrono = { git = "https://github.com/chronotope/chrono.git", branch = "0.5.x" }
componentized-rt = { path = "./crates/componentized-rt" }
filesystem-latch-n = { path = "./crates/filesystem-latch-n" }
heck = "0.5"
tempfile = "3"
test-harness = { path = "./crates/test-harness" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
wasmtime = { version = "49", features = ["component-model-async"] }
wasmtime-wasi = { version = "49", features = ["p3"] }
wit-bindgen = { version = "0.62.0", features = ["async-spawn"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.component-debug]
inherits = "dev"
opt-level = 1        # most of the size win; locals mostly still visible
lto = true
codegen-units = 1
incremental = false  # no benefit with one codegen unit
debug = "full"       # variables and types for lldb, file:line in backtraces
# kept from dev: debug-assertions, overflow-checks, no strip
